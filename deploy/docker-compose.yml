#      restart: unless-stopped

# ── 备选：关闭沙箱（纯 trusted-host，无逃逸风险）──────────────────
#   删除上方 hana 的 cap_add / security_opt / /proc 挂载，并设：
#     environment:
#       HANAKO_SANDBOX_BACKEND: host
#   适用于单用户、受信任、不需工具沙箱隔离的部署场景。
